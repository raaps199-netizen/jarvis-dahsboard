<script>
(()=>{const $=id=>document.getElementById(id);let micOn=false,recognition=null,zTop=20,toastTimer;
function clock(){const n=new Date();$('clockTime').textContent=n.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false});$('clockDate').textContent=n.toLocaleDateString('id-ID',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).toUpperCase()}clock();setInterval(clock,1000);
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
function state(s){$('coreWrap').classList.remove('processing','listening');if(s!=='standby')$('coreWrap').classList.add(s);$('coreStatus').textContent={processing:'PROCESSING REQUEST...',listening:'LISTENING FOR COMMANDS',standby:'PERSONAL ASSISTANT · STANDBY'}[s]}
function speak(s){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='id-ID';u.pitch=.94;speechSynthesis.speak(u)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function win(title,body){const w=document.createElement('section');w.className='win';w.style.zIndex=++zTop;w.innerHTML='<div class="winBar"><span class="winTitle">'+esc(title)+'</span><button class="windowClose" aria-label="Tutup">×</button></div><div class="winBody">'+body+'</div>';$('windows').appendChild(w);w.addEventListener('pointerdown',()=>w.style.zIndex=++zTop);w.querySelector('.windowClose').onclick=()=>w.remove();const bar=w.querySelector('.winBar');let d=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=w.getBoundingClientRect();d={x:e.clientX,y:e.clientY,l:r.left,t:r.top};w.style.transform='none';w.style.left=r.left+'px';w.style.top=r.top+'px';bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!d)return;w.style.left=Math.max(0,Math.min(innerWidth-80,d.l+e.clientX-d.x))+'px';w.style.top=Math.max(0,Math.min(innerHeight-60,d.t+e.clientY-d.y))+'px'});const stop=()=>d=null;bar.addEventListener('pointerup',stop);bar.addEventListener('pointercancel',stop)}
const weeklySchedule={
senin:{lessons:['MTK TL','Inggris','Fisika'],duty:['Khafi','Arjasena','Orlen','Avisha','Fareal','Andrian','Sadam','Wisnu','Tania','Jauharah']},
selasa:{lessons:['Fisika','Sunda','Informatika','PAI'],duty:['Keyla','Mikaela','Ridho','Rizky','Zyella','Nishar','Alvian','Brella','Fathian','Reno']},
rabu:{lessons:['PKN','PKWU','Kimia','B. Indo','SBK'],duty:['Lutfan','Rafif','Kevin','Arya','Al Mira','Elang','Dzaki N.','Aisahra','Satria P','Putri']},
kamis:{lessons:['Kimia','Penjas','Sejarah','MTK U'],duty:['Fahri','Rifqi','Fadhil','Yusuf','Kirana','Effan','Dzaki','Aura','Reva','Surya']},
jumat:{lessons:['MTK TL','MTK U','BK','B. Indo','Informatika'],duty:['Dhirgam','Yoga','Dude','Daffa','Irfan','Ara','Anissa','Meli','Gibran','Salsabila']}
};
const dayNames=['minggu','senin','selasa','rabu','kamis','jumat','sabtu'];
function openSchedule(){const today=dayNames[new Date().getDay()];const actualDay=weeklySchedule[today]?today:'senin';const dateLabel=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});win('J.A.R.V.I.S. · SCHOOL ASSISTANT','<div class="muted">HARI INI · '+esc(dateLabel.toUpperCase())+'</div><p style="margin:10px 0 14px">Sir, ingin melihat apa?</p><div class="quick" style="margin-top:0"><button class="chip" data-kind="lessons">Jadwal pelajaran</button><button class="chip" data-kind="duty">Jadwal piket</button><button class="chip" data-kind="other">Hari lain</button></div><div class="muted" style="margin-top:13px">Saya hanya menampilkan pilihan yang Sir minta.</div>');const w=$('windows').lastElementChild;w.querySelector('[data-kind="lessons"]').onclick=()=>showScheduleType('lessons',actualDay);w.querySelector('[data-kind="duty"]').onclick=()=>showScheduleType('duty',actualDay);w.querySelector('[data-kind="other"]').onclick=()=>chooseScheduleDay();}
function chooseScheduleDay(){const w=$('windows').lastElementChild;if(!w)return;w.querySelector('.winTitle').textContent='PILIH HARI';w.querySelector('.winBody').innerHTML='<p>Jadwal untuk hari apa, Sir?</p><div class="quick">'+Object.keys(weeklySchedule).map(d=>'<button class="chip" data-day="'+d+'">'+d.toUpperCase()+'</button>').join('')+'</div><div class="quick"><button class="chip" data-back="1">Kembali</button></div>';w.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const day=b.dataset.day;w.remove();win('J.A.R.V.I.S. · SCHOOL ASSISTANT','<p>Sir ingin melihat apa untuk hari '+esc(day)+ '?</p><div class="quick"><button class="chip" data-kind="lessons">Jadwal pelajaran</button><button class="chip" data-kind="duty">Jadwal piket</button></div>');const nw=$('windows').lastElementChild;nw.querySelectorAll('[data-kind]').forEach(btn=>btn.onclick=()=>showScheduleType(btn.dataset.kind,day));});w.querySelector('[data-back]').onclick=()=>{w.remove();openSchedule();}}
function showScheduleType(kind,day){const data=weeklySchedule[day];const isLessons=kind==='lessons';const date=new Date();const dayLabel=day.charAt(0).toUpperCase()+day.slice(1);const rows=isLessons?'<div class="lessonGrid">'+data.lessons.map((x,i)=>'<div class="lessonCard"><div class="lessonNum">MATA PELAJARAN '+String(i+1).padStart(2,'0')+'</div><div class="lessonName">'+esc(x)+'</div></div>').join('')+'</div>':'<div class="dutyGrid">'+data.duty.map((x,i)=>'<div class="dutyPerson"><i>'+String(i+1).padStart(2,'0')+'</i><span>'+esc(x)+'</span></div>').join('')+'</div>';const w=$('windows').lastElementChild;if(w)w.remove();win((isLessons?'ACADEMIC SCHEDULE':'DUTY ROSTER')+' · '+day.toUpperCase(),'<div class="scheduleDate"><strong>'+esc(dayLabel)+' · '+(isLessons?'Jadwal Pelajaran':'Daftar Piket')+'</strong><span>'+data[isLessons?'lessons':'duty'].length+' '+(isLessons?'mata pelajaran':'nama siswa')+' · Data kelas</span></div>'+rows+(isLessons?'':'<div class="muted" style="margin-top:12px">Daftar nama sesuai data bot. Hasil pengacakan tugas terbaru dari WhatsApp belum tersambung.</div>')+'<div class="scheduleActions"><button class="chip" data-copy="1">Salin daftar</button><button class="chip" data-again="1">Opsi jadwal</button><button class="chip" data-other="1">Ganti hari</button></div>');const nw=$('windows').lastElementChild;nw.querySelector('[data-copy]').onclick=async()=>{const textCopy=(isLessons?'Jadwal pelajaran':'Daftar piket')+' '+dayLabel+'\\n'+data[isLessons?'lessons':'duty'].map((x,i)=>(i+1)+'. '+x).join('\\n');try{await navigator.clipboard.writeText(textCopy);toast('Daftar berhasil disalin.')}catch(e){toast('Clipboard tidak tersedia di browser ini.')}};nw.querySelector('[data-again]').onclick=()=>{nw.remove();openSchedule()};nw.querySelector('[data-other]').onclick=()=>chooseScheduleDay();speak(isLessons?'Berikut jadwal pelajaran hari '+day+'.':'Berikut daftar piket hari '+day+'.');}

const weatherText=code=>({0:'Cerah',1:'Cerah berawan',2:'Berawan sebagian',3:'Mendung',45:'Berkabut',48:'Kabut tebal',51:'Gerimis ringan',53:'Gerimis',55:'Gerimis lebat',56:'Gerimis beku ringan',57:'Gerimis beku lebat',61:'Hujan ringan',63:'Hujan sedang',65:'Hujan lebat',66:'Hujan beku ringan',67:'Hujan beku lebat',71:'Salju ringan',73:'Salju sedang',75:'Salju lebat',77:'Butiran salju',80:'Hujan lokal ringan',81:'Hujan lokal sedang',82:'Hujan lokal lebat',85:'Hujan salju ringan',86:'Hujan salju lebat',95:'Badai petir',96:'Badai petir dan hujan es',99:'Badai petir kuat'})[code]||'Kondisi tidak diketahui';
function weatherGlyph(code,isDay=true){if(code>=95)return '⛈️';if(code>=80||code>=61)return '🌧️';if(code>=51)return '🌦️';if(code>=45)return '🌫️';if(code===3)return '☁️';if(code===2)return '⛅';if(code===1)return isDay?'🌤️':'☁️';return isDay?'☀️':'🌙';}
function showWeather(){const w=document.createElement('section');w.className='win';w.style.zIndex=++zTop;w.style.width='min(430px,calc(100vw - 24px))';w.innerHTML='<div class="winBar"><span class="winTitle">WEATHER INTELLIGENCE · LIVE</span><button class="windowClose" aria-label="Tutup">×</button></div><div class="winBody"><div class="muted" id="weatherPlace">MENCARI LOKASI...</div><div class="weatherHero" style="margin-top:10px"><div class="weatherHeroTop"><div><div class="muted" id="weatherDay">CUACA SAAT INI</div><div class="weatherTemp" id="weatherTemp">--°</div><div class="weatherCondition" id="weatherCondition">Mengambil data...</div></div><div class="weatherGlyph" id="weatherGlyph" aria-hidden="true">🌤️</div></div></div><div class="weatherMetrics" id="weatherMetrics"><div class="weatherMetric"><span>TERASA SEPERTI</span><strong>--°C</strong></div><div class="weatherMetric"><span>KELEMBAPAN</span><strong>--%</strong></div><div class="weatherMetric"><span>KECEPATAN ANGIN</span><strong>-- km/j</strong></div><div class="weatherMetric"><span>PELUANG HUJAN</span><strong>--%</strong></div></div><div class="widgetSection"><div class="widgetSectionHead"><span>PER JAM</span><span>HARI INI</span></div><div class="hourStrip" id="weatherHourly"><div class="muted">Memuat prakiraan...</div></div></div><div class="widgetSection"><div class="widgetSectionHead"><span>5 HARI KE DEPAN</span><span>PERKIRAAN</span></div><div class="forecastStrip" id="weatherForecast"><div class="muted">Memuat prakiraan...</div></div></div><div class="weatherFooter"><div class="muted" id="weatherUpdated">Memuat data terbaru...</div><div class="quick" style="margin:0"><button class="chip" id="weatherRefresh">↻ Perbarui</button><button class="chip" id="weatherLocation">Lokasi saya</button></div></div><div class="muted" style="margin-top:12px">Sumber: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Data prakiraan model, bukan pengukuran sensor langsung.</div></div>';$('windows').appendChild(w);w.addEventListener('pointerdown',()=>w.style.zIndex=++zTop);w.querySelector('.windowClose').onclick=()=>w.remove();const bar=w.querySelector('.winBar');let d=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=w.getBoundingClientRect();d={x:e.clientX,y:e.clientY,l:r.left,t:r.top};w.style.transform='none';w.style.left=r.left+'px';w.style.top=r.top+'px';bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!d)return;w.style.left=Math.max(0,Math.min(innerWidth-80,d.l+e.clientX-d.x))+'px';w.style.top=Math.max(0,Math.min(innerHeight-60,d.t+e.clientY-d.y))+'px'});bar.addEventListener('pointerup',()=>d=null);bar.addEventListener('pointercancel',()=>d=null);
async function loadWeather(useGeo=true){$('weatherPlace').textContent='MENENTUKAN LOKASI...';$('weatherCondition').textContent='Mengambil data cuaca terbaru...';$('weatherUpdated').textContent='Menghubungi layanan cuaca...';let lat=-6.478,lon=106.978,place='Klapanunggal, Bogor (lokasi perkiraan)';if(useGeo&&navigator.geolocation){try{const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,timeout:7000,maximumAge:300000}));lat=pos.coords.latitude;lon=pos.coords.longitude;place='Lokasi perangkat';}catch(e){place='Klapanunggal, Bogor (lokasi perkiraan)';}}try{const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,showers,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=5&timezone=Asia%2FJakarta';const res=await fetch(url);if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();const cur=data.current;if(!cur)throw new Error('Data cuaca kosong');const times=data.hourly?.time||[],probs=data.hourly?.precipitation_probability||[],htemps=data.hourly?.temperature_2m||[],hcodes=data.hourly?.weather_code||[];let ix=times.indexOf(cur.time);if(ix<0)ix=times.findIndex(t=>t>=cur.time);const chance=ix>=0&&probs[ix]!=null?probs[ix]:null;$('weatherPlace').textContent=place.toUpperCase();$('weatherTemp').textContent=Math.round(cur.temperature_2m)+'°C';$('weatherCondition').textContent=weatherText(cur.weather_code)+(cur.is_day?' · Siang':' · Malam');$('weatherGlyph').textContent=weatherGlyph(cur.weather_code,!!cur.is_day);$('weatherMetrics').innerHTML='<div class="weatherMetric"><span>TERASA SEPERTI</span><strong>'+Math.round(cur.apparent_temperature)+'°C</strong></div><div class="weatherMetric"><span>KELEMBAPAN</span><strong>'+cur.relative_humidity_2m+'%</strong></div><div class="weatherMetric"><span>KECEPATAN ANGIN</span><strong>'+Math.round(cur.wind_speed_10m)+' km/j</strong></div><div class="weatherMetric"><span>PELUANG HUJAN</span><strong>'+(chance==null?'--':chance+'%')+'</strong></div>';$('weatherHourly').innerHTML='';const hourIndexes=[];for(let i=Math.max(0,ix);i<Math.min(times.length,Math.max(0,ix)+8);i++)hourIndexes.push(i);if(!hourIndexes.length)$('weatherHourly').innerHTML='<div class="muted">Prakiraan per jam tidak tersedia.</div>';hourIndexes.forEach(i=>{const item=document.createElement('div');item.className='hourItem';item.innerHTML='<span>'+new Date(times[i]).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+'</span><b>'+weatherGlyph(hcodes[i],true)+' '+Math.round(htemps[i])+'°</b><small>'+((probs[i]==null)?'--':probs[i]+'% hujan')+'</small>'; $('weatherHourly').appendChild(item)});const daily=data.daily||{};$('weatherForecast').innerHTML='';(daily.time||[]).forEach((day,i)=>{const card=document.createElement('div');card.className='forecastDay';const date=new Date(day+'T12:00:00');const dayName=i===0?'Hari ini':date.toLocaleDateString('id-ID',{weekday:'short'});card.innerHTML='<b>'+dayName+'</b><span class="miniGlyph">'+weatherGlyph(daily.weather_code[i],true)+'</span><strong>'+Math.round(daily.temperature_2m_max[i])+'°</strong><small>'+Math.round(daily.temperature_2m_min[i])+'° · '+(daily.precipitation_probability_max[i]==null?'--':daily.precipitation_probability_max[i]+'%')+'</small>'; $('weatherForecast').appendChild(card)});$('weatherUpdated').textContent='Model: '+new Date(cur.time).toLocaleString('id-ID',{weekday:'short',hour:'2-digit',minute:'2-digit'})+' · dicek '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}catch(e){$('weatherPlace').textContent=place.toUpperCase();$('weatherCondition').textContent='Data cuaca gagal dimuat.';$('weatherMetrics').innerHTML='<div class="weatherMetric" style="grid-column:1/-1"><span>STATUS</span><strong>Koneksi gagal. Periksa internet lalu perbarui.</strong></div>';$('weatherHourly').innerHTML='';$('weatherForecast').innerHTML='';$('weatherUpdated').textContent='Layanan cuaca tidak merespons.';}}w.querySelector('#weatherRefresh').onclick=()=>loadWeather(true);w.querySelector('#weatherLocation').onclick=()=>loadWeather(true);loadWeather(true);}
function command(raw){const c=raw.trim();if(!c)return;$('menuPanel').classList.remove('open');state('processing');const l=c.toLowerCase();setTimeout(()=>{if(l.includes('cuaca')||l.includes('weather')){showWeather();speak('Mengambil data cuaca terbaru untuk lokasi Sir.')}else if(l.includes('jadwal')||l.includes('pelajaran')||l.includes('piket')){openSchedule();}else if(l.includes('catatan')){win('QUICK NOTES','<textarea placeholder="Tulis catatan..." aria-label="Catatan" style="width:100%;min-height:110px;resize:vertical;color:#e9f8ff;background:#000819a6;border:1px solid #67e8ff38;border-radius:9px;padding:10px;font:inherit"></textarea><div class="muted">Catatan belum tersimpan permanen.</div>');speak('Panel catatan dibuka.')}else if(l.includes('bantuan')||l.includes('help')){win('HELP · COMMANDS','<div>Contoh perintah:</div><div class="placeholder">• Cuaca hari ini<br>• Jadwal pelajaran hari ini<br>• Buka catatan</div><div class="muted">Kontrol komputer akan dihubungkan ke agent Python di laptop.</div>');speak('Saya dapat membuka panel cuaca, jadwal, dan catatan pada prototipe ini.')}else{win('COMMAND RECEIVED','<div class="muted">PERINTAH DITERIMA</div><p>'+esc(c)+'</p><div class="placeholder">Perintah ini belum terhubung ke agent Python.</div>');speak('Perintah diterima. Aksi ini belum terhubung ke agent komputer.')}state('standby')},450)}
$('menuBtn').onclick=()=>$('menuPanel').classList.toggle('open');$('menuClose').onclick=()=>$('menuPanel').classList.remove('open');$('commandForm').onsubmit=e=>{e.preventDefault();command($('commandInput').value);$('commandInput').value=''};document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command));
function setMic(on){micOn=on;$('micBtn').classList.toggle('on',on);$('micLabel').textContent=on?'MIKROFON AKTIF':'MIKROFON NONAKTIF';$('micHint').textContent=on?'Tekan lagi untuk mematikan':'Tekan untuk mengaktifkan';$('micBtn').setAttribute('aria-label',on?'Matikan mikrofon':'Aktifkan mikrofon');if(!on){if(recognition)try{recognition.stop()}catch(e){}recognition=null;state('standby');toast('Mikrofon dinonaktifkan.');return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Pengenalan suara tidak didukung browser ini. Gunakan menu manual.');return}recognition=new SR();recognition.lang='id-ID';recognition.continuous=true;recognition.interimResults=false;recognition.onstart=()=>{if(micOn)state('listening')};recognition.onresult=e=>command(e.results[e.results.length-1][0].transcript);recognition.onerror=e=>{if(e.error!=='no-speech'&&micOn)toast('Suara: '+e.error+'. Coba menu manual.')};recognition.onend=()=>{if(micOn&&recognition)try{recognition.start()}catch(e){}else state('standby')};try{recognition.start();toast('Mikrofon aktif. Izinkan akses mikrofon bila diminta.')}catch(e){toast('Tidak dapat memulai mikrofon. Periksa izin browser.')}}
async function enterFullscreen(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();$('fullBtn').textContent='⛶';$('fullBtn').title='Keluar layar penuh';toast('Mode layar penuh aktif.')}else{await document.exitFullscreen();$('fullBtn').title='Layar penuh';}}catch(e){toast('Browser membatasi layar penuh otomatis. Tekan tombol ⛶ untuk mencoba lagi.')}}
$('fullBtn').onclick=enterFullscreen;document.addEventListener('fullscreenchange',()=>{$('fullBtn').title=document.fullscreenElement?'Keluar layar penuh':'Layar penuh'});const autoFull=()=>{if(!document.fullscreenElement)enterFullscreen();document.removeEventListener('pointerdown',autoFull)};document.addEventListener('pointerdown',autoFull,{once:true});
$('micBtn').onclick=()=>setMic(!micOn);document.addEventListener('keydown',e=>{if(e.key==='Escape')$('menuPanel').classList.remove('open');if(e.key==='/'&&document.activeElement!==$('commandInput')){e.preventDefault();$('menuPanel').classList.add('open');$('commandInput').focus()}});
})();
