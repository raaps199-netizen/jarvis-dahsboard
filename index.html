   const analysis=paragraphs.length>2?paragraphs.slice(2,-1).join('\n\n')||summary:summary;
   const conclusion=paragraphs.slice(-2).join('\n\n')||summary.slice(-900);
   const articleCards=pages.map((item,i)=>'<article style="padding:12px 0;border-bottom:1px solid #67e8ff24"><h3 style="font-size:14px;margin:0 0 6px;color:#a8edff">'+safe(item.title||('Temuan '+(i+1)))+'</h3><p style="margin:0;color:#c5d9e8">'+safe(String(item.text||item.description||'').slice(0,950))+'</p></article>').join('');
   const imageCards=images.map(item=>'<figure style="margin:0 0 15px"><img src="'+safe(item.url)+'" alt="'+safe(item.alt||'Visual riset')+'" loading="lazy" style="width:100%;max-height:260px;object-fit:contain;background:#020a18;border-radius:10px"><figcaption style="font-size:11px;color:#9dbbd0;margin-top:5px">'+safe(item.alt||'Visual pendukung')+'</figcaption></figure>').join('');
   w.remove();
   makeWindow('Overview','<div style="font-size:10px;letter-spacing:.16em;color:#6de7ff">RESEARCH BRIEF</div><h2 style="font-size:22px;line-height:1.3;margin:9px 0 14px">'+safe(q)+'</h2><div style="white-space:normal;line-height:1.8">'+escLines(lead)+'</div><div class="placeholder" style="margin-top:15px">Dikumpulkan dalam '+safe(data.elapsed_seconds||duration)+' detik fase pencarian · '+pages.length+' halaman berhasil dibaca.</div>',0);
   makeWindow('Analysis','<h2 style="font-size:19px;color:#a8edff;margin-top:0">Analisis mendalam</h2><div style="line-height:1.85">'+escLines(analysis)+'</div><p class="muted" style="margin-top:15px">'+safe(data.notice||'Hasil disusun dari bahan yang berhasil dikumpulkan.')+'</p>',1);
   makeWindow('Findings','<h2 style="font-size:19px;color:#a8edff;margin-top:0">Temuan dan bahan riset</h2><p class="muted">Halaman yang berhasil dibaca: '+pages.length+'</p>'+(articleCards||'<p>Belum ada isi halaman yang cukup berhasil diambil. Coba ulang dengan durasi lebih panjang.</p>'),2);
   makeWindow('Visuals','<h2 style="font-size:19px;color:#a8edff;margin-top:0">Visual pendukung</h2>'+(imageCards||'<p>Belum ada gambar yang berhasil diambil dari halaman yang dibuka.</p>'),3);
   makeWindow('Conclusion','<h2 style="font-size:19px;color:#a8edff;margin-top:0">Kesimpulan</h2><div style="line-height:1.85">'+escLines(conclusion)+'</div><p class="muted" style="margin-top:18px">Periksa kembali klaim penting dan konteks data sebelum menggunakannya sebagai rujukan formal.</p>',4);
   status.textContent='Selesai · '+pages.length+' halaman · '+images.length+' visual · '+(data.local_model_used?'AI lokal':'mode kompilasi');
  }catch(err){
   status.textContent='Research Agent belum siap';
   overview.innerHTML='<h3 style="color:#ffbd8a">Belum bisa memulai riset</h3><p style="line-height:1.7">'+safe(err.message||err)+'</p><p class="muted">Jalankan START-RESEARCH-AGENT.bat dari repo JARVIS di laptop dan biarkan terminalnya terbuka. Kalau browser meminta izin atau persetujuan, selesaikan secara manual.</p>';
  }
 }
 form.onsubmit=e=>{e.preventDefault();const q=input.value.trim();if(q)openResearch(q)};
 if(initialQuery){form.style.display='none';const hint=w.querySelector('.muted[style]');if(hint)hint.textContent='Jendela hasil terpisah. Geser header, ubah ukuran, atau buka riset lain agar jendelanya menumpuk.';input.value=initialQuery;research(initialQuery)}
}
function openWebSearch(initialQuery=''){const w=document.createElement('section');w.className='win webSearchWin';w.style.zIndex=++zTop;w.innerHTML='<div class="winBar"><span class="winTitle">J.A.R.V.I.S. · WEB SEARCH</span><div class="winTools"><button class="windowSizeBtn" data-size="down" aria-label="Perkecil jendela" title="Perkecil">−</button><button class="windowSizeBtn" data-size="up" aria-label="Perbesar jendela" title="Perbesar">+</button><button class="windowClose" aria-label="Tutup">×</button></div></div><div class="winBody"><form class="webSearchForm"><input type="search" placeholder="Cari di web..." aria-label="Cari di web" value="'+esc(initialQuery)+'"/><button type="submit">Cari</button></form><div class="webSearchFallback"><span class="muted" data-search-status>Masukkan pencarian. Jika situs menolak tampilan tertanam, buka hasil di tab baru.</span><a href="https://www.google.com/" target="_blank" rel="noopener" data-open-tab>Google di tab baru ↗</a></div><iframe class="webSearchFrame" title="Hasil pencarian web" referrerpolicy="no-referrer" src="about:blank"></iframe></div>';$('windows').appendChild(w);w.addEventListener('pointerdown',()=>w.style.zIndex=++zTop);w.querySelector('.windowClose').onclick=()=>w.remove();const bar=w.querySelector('.winBar');let d=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=w.getBoundingClientRect();d={x:e.clientX,y:e.clientY,l:r.left,t:r.top};w.style.transform='none';w.style.left=r.left+'px';w.style.top=r.top+'px';bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!d)return;w.style.left=Math.max(0,Math.min(innerWidth-80,d.l+e.clientX-d.x))+'px';w.style.top=Math.max(0,Math.min(innerHeight-60,d.t+e.clientY-d.y))+'px'});bar.addEventListener('pointerup',()=>d=null);bar.addEventListener('pointercancel',()=>d=null);const form=w.querySelector('.webSearchForm'),input=form.querySelector('input'),frame=w.querySelector('.webSearchFrame'),status=w.querySelector('[data-search-status]'),openTab=w.querySelector('[data-open-tab]');function search(q){q=q.trim();if(!q)return;const url='https://www.google.com/search?igu=1&q='+encodeURIComponent(q);frame.src=url;openTab.href='https://www.google.com/search?q='+encodeURIComponent(q);status.textContent='Mencari: '+q+' · Jika hasil tidak muncul di panel, gunakan tautan tab baru.';}form.onsubmit=e=>{e.preventDefault();search(input.value)};if(initialQuery)search(initialQuery);w.querySelector('.winBody').style.height='calc(100% - 43px)';}
function command(raw){const c=raw.trim();if(!c)return;$('menuPanel').classList.remove('open');state('processing');const l=c.toLowerCase();setTimeout(()=>{if(l.includes('cuaca')||l.includes('weather')){showWeather();speak('Mengambil data cuaca terbaru untuk lokasi Sir.')}else if(l.includes('jadwal')||l.includes('pelajaran')||l.includes('piket')){openSchedule();}else if(l.includes('riset')||l.includes('research')||l.startsWith('apa itu ')||l.startsWith('jelaskan ')){openResearch(c.replace(/^(riset|research|cari tahu|apa itu|jelaskan)\s*/i,''));}else if(l.includes('cari web')||l.includes('search web')||l.startsWith('cari ')){openWebSearch(l.replace(/^(cari web|search web|cari)\s*/,'').trim());}else if(l.includes('catatan')){win('QUICK NOTES','<textarea placeholder="Tulis catatan..." aria-label="Catatan" style="width:100%;min-height:110px;resize:vertical;color:#e9f8ff;background:#000819a6;border:1px solid #67e8ff38;border-radius:9px;padding:10px;font:inherit"></textarea><div class="muted">Catatan belum tersimpan permanen.</div>');speak('Panel catatan dibuka.')}else if(l.includes('bantuan')||l.includes('help')){win('HELP · COMMANDS','<div>Contoh perintah:</div><div class="placeholder">• Cuaca hari ini<br>• Jadwal pelajaran hari ini<br>• Buka catatan</div><div class="muted">Kontrol komputer akan dihubungkan ke agent Python di laptop.</div>');speak('Saya dapat membuka panel cuaca, jadwal, dan catatan pada prototipe ini.')}else{win('COMMAND RECEIVED','<div class="muted">PERINTAH DITERIMA</div><p>'+esc(c)+'</p><div class="placeholder">Perintah ini belum terhubung ke agent Python.</div>');speak('Perintah diterima. Aksi ini belum terhubung ke agent komputer.')}state('standby')},450)}
const commandMenu=document.createElement('section');commandMenu.className='commandMenu';commandMenu.id='commandMenu';commandMenu.innerHTML='<div class="commandMenuHead"><span id="commandMenuTitle">J.A.R.V.I.S. · MENU</span><button class="commandMenuClose" id="commandMenuClose" aria-label="Tutup menu">×</button></div><div class="commandMenuIntro" id="commandMenuIntro">Apa yang bisa saya bantu?</div><p class="commandMenuSub" id="commandMenuSub">Akses cepat ke fitur utama.</p><div class="commandMenuGrid" id="commandMenuGrid"></div><div class="commandMenuHint"><kbd>ESC</kbd> untuk menutup <span>·</span> Ketuk area kosong dua kali untuk membuka</div>';document.body.appendChild(commandMenu);
function showMainMenu(){commandMenu.classList.add('open');document.body.classList.add('menuOpen');$('commandMenuTitle').textContent='J.A.R.V.I.S. · MENU';$('commandMenuIntro').textContent='Apa yang bisa saya bantu?';$('commandMenuSub').textContent='Akses cepat ke fitur utama.';$('commandMenuGrid').innerHTML='<button class="commandMenuItem" data-action="weather"><span>☼</span>Cuaca</button><button class="commandMenuItem" data-action="search"><span>⌕</span>Cari web</button><button class="commandMenuItem" data-action="research"><span>⌘</span>Research Mode</button><button class="commandMenuItem" data-action="schedule"><span>▦</span>Jadwal sekolah</button><button class="commandMenuItem" data-action="notes"><span>✎</span>Catatan</button><button class="commandMenuItem" data-action="commands"><span>⌘</span>Perintah lain</button><button class="commandMenuItem" data-action="fullscreen"><span>⛶</span>Layar penuh</button><button class="commandMenuItem" data-action="mic"><span>◉</span>Mikrofon</button>';commandMenu.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const action=b.dataset.action;hideMainMenu();if(action==='weather')command('cuaca hari ini');else if(action==='search')openWebSearch();else if(action==='research')openResearch();else if(action==='schedule')openSchedule();else if(action==='notes')command('buka catatan');else if(action==='fullscreen')enterFullscreen();else if(action==='mic')setMic(!micOn);else if(action==='commands')showCommandSubmenu();});}
function showCommandSubmenu(){commandMenu.classList.add('open');document.body.classList.add('menuOpen');$('commandMenuTitle').textContent='J.A.R.V.I.S. · COMMANDS';$('commandMenuIntro').textContent='Perintah lainnya';$('commandMenuSub').textContent='Pilih fungsi yang ingin dijalankan.';$('commandMenuGrid').innerHTML='<button class="commandMenuItem" data-cmd="bantuan"><span>?</span>Bantuan</button><button class="commandMenuItem" data-cmd="jadwal piket"><span>✓</span>Jadwal piket</button><button class="commandMenuItem" data-cmd="jadwal pelajaran"><span>▤</span>Jadwal pelajaran</button><button class="commandMenuItem" data-cmd="cuaca hari ini"><span>☁</span>Cuaca hari ini</button><button class="commandMenuItem" data-back="1"><span>←</span>Kembali</button>';commandMenu.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{hideMainMenu();command(b.dataset.cmd)});commandMenu.querySelector('[data-back]').onclick=showMainMenu;}
function hideMainMenu(){commandMenu.classList.remove('open');document.body.classList.remove('menuOpen');}
$('commandMenuClose').onclick=hideMainMenu;
let lastTap=0;document.addEventListener('pointerup',e=>{if(e.target.closest('button,input,textarea,a,.win,.menuPanel,.commandMenu'))return;const now=Date.now();if(now-lastTap<380){if(commandMenu.classList.contains('open'))hideMainMenu();else showMainMenu();lastTap=0;}else lastTap=now;});
document.addEventListener('dblclick',e=>{if(e.target.closest('button,input,textarea,a,.win,.menuPanel,.commandMenu'))return;if(commandMenu.classList.contains('open'))hideMainMenu();else showMainMenu();});

$('menuClose').onclick=()=>$('menuPanel').classList.remove('open');$('commandForm').onsubmit=e=>{e.preventDefault();command($('commandInput').value);$('commandInput').value=''};document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command));
function setMic(on){micOn=on;$('micBtn').classList.toggle('on',on);$('micLabel').textContent=on?'MIKROFON AKTIF':'MIKROFON NONAKTIF';$('micHint').textContent=on?'Tekan lagi untuk mematikan':'Tekan untuk mengaktifkan';$('micBtn').setAttribute('aria-label',on?'Matikan mikrofon':'Aktifkan mikrofon');if(!on){if(recognition)try{recognition.stop()}catch(e){}recognition=null;state('standby');toast('Mikrofon dinonaktifkan.');return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Pengenalan suara tidak didukung browser ini. Gunakan menu manual.');return}recognition=new SR();recognition.lang='id-ID';recognition.continuous=true;recognition.interimResults=false;recognition.onstart=()=>{if(micOn)state('listening')};recognition.onresult=e=>command(e.results[e.results.length-1][0].transcript);recognition.onerror=e=>{if(e.error!=='no-speech'&&micOn)toast('Suara: '+e.error+'. Coba menu manual.')};recognition.onend=()=>{if(micOn&&recognition)try{recognition.start()}catch(e){}else state('standby')};try{recognition.start();toast('Mikrofon aktif. Izinkan akses mikrofon bila diminta.')}catch(e){toast('Tidak dapat memulai mikrofon. Periksa izin browser.')}}
async function enterFullscreen(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();toast('Mode layar penuh aktif.')}else{await document.exitFullscreen();}}catch(e){toast('Browser tidak mengizinkan fullscreen otomatis. Gunakan tombol ⛶.')}}

document.addEventListener('click',e=>{const b=e.target.closest('.windowSizeBtn');if(!b)return;const w=b.closest('.win');if(!w)return;const r=w.getBoundingClientRect();const factor=b.dataset.size==='up'?1.18:0.84;const minW=220,minH=145,maxW=innerWidth-12,maxH=innerHeight-12;w.style.width=Math.round(Math.max(minW,Math.min(maxW,r.width*factor)))+'px';w.style.height=Math.round(Math.max(minH,Math.min(maxH,r.height*factor)))+'px';w.style.maxWidth='calc(100vw - 12px)';w.style.maxHeight='calc(100vh - 12px)';});
