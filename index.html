const weeklySchedule={

function openSchedule(){const today=dayNames[new Date().getDay()];const actualDay=weeklySchedule[today]?today:'senin';const dateLabel=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});win('J.A.R.V.I.S. · SCHOOL ASSISTANT','<div class="muted">HARI INI · '+esc(dateLabel.toUpperCase())+'</div><p style="margin:10px 0 14px">Sir, ingin melihat apa?</p><div class="quick" style="margin-top:0"><button class="chip" data-kind="lessons">Jadwal pelajaran</button><button class="chip" data-kind="duty">Jadwal piket</button><button class="chip" data-kind="other">Hari lain</button></div><div class="muted" style="margin-top:13px">Saya hanya menampilkan pilihan yang Sir minta.</div>');const w=$('windows').lastElementChild;w.querySelector('[data-kind="lessons"]').onclick=()=>showScheduleType('lessons',actualDay);w.querySelector('[data-kind="duty"]').onclick=()=>showScheduleType('duty',actualDay);w.querySelector('[data-kind="other"]').onclick=()=>chooseScheduleDay();}

function showScheduleType(kind,day){const data=weeklySchedule[day];const isLessons=kind==='lessons';const rows=(isLessons?data.lessons:data.duty).map((x,i)=>isLessons?'<div class="placeholder" style="margin-top:6px">'+(i+1)+'. '+esc(x)+'</div>':'<span style="display:inline-block;padding:6px 9px;margin:4px 4px 0 0;border:1px solid #67e8ff38;border-radius:8px;background:#0a2444">'+esc(x)+'</span>').join('');const w=$('windows').lastElementChild;if(w)w.remove();win((isLessons?'JADWAL PELAJARAN':'DAFTAR PIKET')+' · '+day.toUpperCase(),'<div class="muted">'+esc(new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'}).toUpperCase())+'</div><div style="margin-top:10px">'+rows+'</div>'+(isLessons?'':'<div class="muted" style="margin-top:14px">Ini daftar piket harian dari kode bot. Hasil pengacakan tugas terbaru dari WhatsApp belum tersambung.</div>')+'<div class="quick"><button class="chip" data-again="1">Lihat opsi lain</button><button class="chip" data-other="1">Ganti hari</button></div>');const nw=$('windows').lastElementChild;nw.querySelector('[data-again]').onclick=()=>{nw.remove();openSchedule()};nw.querySelector('[data-other]').onclick=()=>chooseScheduleDay();speak(isLessons?'Berikut jadwal pelajaran hari '+day+'.':'Berikut daftar piket hari '+day+'.');}

const weatherText=code=>({0:'Cerah',1:'Cerah berawan',2:'Berawan sebagian',3:'Mendung',45:'Berkabut',48:'Kabut tebal',51:'Gerimis ringan',53:'Gerimis',55:'Gerimis lebat',56:'Gerimis beku ringan',57:'Gerimis beku lebat',61:'Hujan ringan',63:'Hujan sedang',65:'Hujan lebat',66:'Hujan beku ringan',67:'Hujan beku lebat',71:'Salju ringan',73:'Salju sedang',75:'Salju lebat',77:'Butiran salju',80:'Hujan lokal ringan',81:'Hujan lokal sedang',82:'Hujan lokal lebat',85:'Hujan salju ringan',86:'Hujan salju lebat',95:'Badai petir',96:'Badai petir dan hujan es',99:'Badai petir kuat'})[code]||'Kondisi tidak diketahui';
function showWeather(){const w=document.createElement('section');w.className='win';w.style.zIndex=++zTop;w.innerHTML='<div class="winBar"><span class="winTitle">WEATHER · LIVE</span><button class="windowClose" aria-label="Tutup">×</button></div><div class="winBody"><div class="muted" id="weatherPlace">MENCARI LOKASI...</div><div class="bigTemp" id="weatherTemp">--°C</div><div id="weatherCondition">Mengambil data cuaca...</div><div class="placeholder" id="weatherDetails">Suhu terasa: --°C<br>Kelembapan: --%<br>Angin: -- km/j<br>Peluang hujan: --%</div><div class="muted" id="weatherUpdated" style="margin-top:10px">Memuat data terbaru...</div><div class="quick"><button class="chip" id="weatherRefresh">Perbarui</button><button class="chip" id="weatherLocation">Gunakan lokasi perangkat</button></div><div class="muted" style="margin-top:10px">Sumber: <a href="https://open-meteo.com/" target="_blank" rel="noopener" style="color:#73eaff">Open-Meteo</a>. Prakiraan model, bukan pengukuran dari sensor di lokasi.</div></div>';$('windows').appendChild(w);w.addEventListener('pointerdown',()=>w.style.zIndex=++zTop);w.querySelector('.windowClose').onclick=()=>w.remove();const bar=w.querySelector('.winBar');let d=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=w.getBoundingClientRect();d={x:e.clientX,y:e.clientY,l:r.left,t:r.top};w.style.transform='none';w.style.left=r.left+'px';w.style.top=r.top+'px';bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!d)return;w.style.left=Math.max(0,Math.min(innerWidth-80,d.l+e.clientX-d.x))+'px';w.style.top=Math.max(0,Math.min(innerHeight-60,d.t+e.clientY-d.y))+'px'});bar.addEventListener('pointerup',()=>d=null);bar.addEventListener('pointercancel',()=>d=null);
async function loadWeather(useGeo=true){$('weatherPlace').textContent='MENENTUKAN LOKASI...';$('weatherCondition').textContent='Mengambil data cuaca terbaru...';$('weatherUpdated').textContent='Menghubungi layanan cuaca...';let lat=-6.478,lon=106.978,place='Klapanunggal, Bogor (lokasi perkiraan)';if(useGeo&&navigator.geolocation){try{const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,timeout:7000,maximumAge:300000}));lat=pos.coords.latitude;lon=pos.coords.longitude;place='Lokasi perangkat';}catch(e){place='Klapanunggal, Bogor (lokasi perkiraan)';}}try{const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,showers,weather_code,wind_speed_10m&hourly=precipitation_probability&forecast_days=1&timezone=Asia%2FJakarta';const res=await fetch(url);if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();const cur=data.current;if(!cur)throw new Error('Data cuaca kosong');const times=data.hourly?.time||[],probs=data.hourly?.precipitation_probability||[];let ix=times.indexOf(cur.time);if(ix<0)ix=times.findIndex(t=>t>=cur.time);const chance=ix>=0&&probs[ix]!=null?probs[ix]:null;$('weatherPlace').textContent=place.toUpperCase();$('weatherTemp').textContent=Math.round(cur.temperature_2m)+'°C';$('weatherCondition').textContent=weatherText(cur.weather_code)+(cur.is_day?' · Siang':' · Malam');$('weatherDetails').innerHTML='Suhu terasa: '+Math.round(cur.apparent_temperature)+'°C<br>Kelembapan: '+cur.relative_humidity_2m+'%<br>Angin: '+Math.round(cur.wind_speed_10m)+' km/j<br>Peluang hujan per jam: '+(chance==null?'tidak tersedia':chance+'%')+'<br>Curah hujan saat ini: '+Number(cur.precipitation||0).toFixed(1)+' mm';$('weatherUpdated').textContent='Data model: '+new Date(cur.time).toLocaleString('id-ID',{weekday:'short',hour:'2-digit',minute:'2-digit'})+' · diperbarui '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}catch(e){$('weatherPlace').textContent=place.toUpperCase();$('weatherCondition').textContent='Data cuaca gagal dimuat.';$('weatherDetails').textContent='Periksa koneksi internet lalu tekan Perbarui.';$('weatherUpdated').textContent='Layanan cuaca tidak merespons.';}}w.querySelector('#weatherRefresh').onclick=()=>loadWeather(true);w.querySelector('#weatherLocation').onclick=()=>loadWeather(true);loadWeather(true);}
function command(raw){const c=raw.trim();if(!c)return;$('menuPanel').classList.remove('open');state('processing');const l=c.toLowerCase();setTimeout(()=>{if(l.includes('cuaca')||l.includes('weather')){showWeather();speak('Mengambil data cuaca terbaru untuk lokasi Sir.')}else if(l.includes('jadwal')||l.includes('pelajaran')||l.includes('piket')){openSchedule();}else if(l.includes('catatan')){win('QUICK NOTES','<textarea placeholder="Tulis catatan..." aria-label="Catatan" style="width:100%;min-height:110px;resize:vertical;color:#e9f8ff;background:#000819a6;border:1px solid #67e8ff38;border-radius:9px;padding:10px;font:inherit"></textarea><div class="muted">Catatan belum tersimpan permanen.</div>');speak('Panel catatan dibuka.')}else if(l.includes('bantuan')||l.includes('help')){win('HELP · COMMANDS','<div>Contoh perintah:</div><div class="placeholder">• Cuaca hari ini<br>• Jadwal pelajaran hari ini<br>• Buka catatan</div><div class="muted">Kontrol komputer akan dihubungkan ke agent Python di laptop.</div>');speak('Saya dapat membuka panel cuaca, jadwal, dan catatan pada prototipe ini.')}else{win('COMMAND RECEIVED','<div class="muted">PERINTAH DITERIMA</div><p>'+esc(c)+'</p><div class="placeholder">Perintah ini belum terhubung ke agent Python.</div>');speak('Perintah diterima. Aksi ini belum terhubung ke agent komputer.')}state('standby')},450)}
$('menuBtn').onclick=()=>$('menuPanel').classList.toggle('open');$('menuClose').onclick=()=>$('menuPanel').classList.remove('open');$('commandForm').onsubmit=e=>{e.preventDefault();command($('commandInput').value);$('commandInput').value=''};document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command));
function setMic(on){micOn=on;$('micBtn').classList.toggle('on',on);$('micLabel').textContent=on?'MIKROFON AKTIF':'MIKROFON NONAKTIF';$('micHint').textContent=on?'Tekan lagi untuk mematikan':'Tekan untuk mengaktifkan';$('micBtn').setAttribute('aria-label',on?'Matikan mikrofon':'Aktifkan mikrofon');if(!on){if(recognition)try{recognition.stop()}catch(e){}recognition=null;state('standby');toast('Mikrofon dinonaktifkan.');return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Pengenalan suara tidak didukung browser ini. Gunakan menu manual.');return}recognition=new SR();recognition.lang='id-ID';recognition.continuous=true;recognition.interimResults=false;recognition.onstart=()=>{if(micOn)state('listening')};recognition.onresult=e=>command(e.results[e.results.length-1][0].transcript);recognition.onerror=e=>{if(e.error!=='no-speech'&&micOn)toast('Suara: '+e.error+'. Coba menu manual.')};recognition.onend=()=>{if(micOn&&recognition)try{recognition.start()}catch(e){}else state('standby')};try{recognition.start();toast('Mikrofon aktif. Izinkan akses mikrofon bila diminta.')}catch(e){toast('Tidak dapat memulai mikrofon. Periksa izin browser.')}}
async function enterFullscreen(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();$('fullBtn').textContent='⛶';$('fullBtn').title='Keluar layar penuh';toast('Mode layar penuh aktif.')}else{await document.exitFullscreen();$('fullBtn').title='Layar penuh';}}catch(e){toast('Browser membatasi layar penuh otomatis. Tekan tombol ⛶ untuk mencoba lagi.')}}
$('fullBtn').onclick=enterFullscreen;document.addEventListener('fullscreenchange',()=>{$('fullBtn').title=document.fullscreenElement?'Keluar layar penuh':'Layar penuh'});const autoFull=()=>{if(!document.fullscreenElement)enterFullscreen();document.removeEventListener('pointerdown',autoFull)};document.addEventListener('pointerdown',autoFull,{once:true});
$('micBtn').onclick=()=>setMic(!micOn);document.addEventListener('keydown',e=>{if(e.key==='Escape')$('menuPanel').classList.remove('open');if(e.key==='/'&&document.activeElement!==$('commandInput')){e.preventDefault();$('menuPanel').classList.add('open');$('commandInput').focus()}});
})();
</script>
</body></html>
